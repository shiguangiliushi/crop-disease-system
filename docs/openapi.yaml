        因此发帖编辑器里插入图片必定失败。这里补上通用实现。

        第 91 批（安全）修掉三处：
          ① 没有大小上限 —— 任何登录用户都能刷爆磁盘；
          ② 只比 `content_type`（客户端可伪造）—— 改成按**文件头**探测真实格式；
          ③ 直接用用户的原始文件名拼路径 —— 改成随机文件名 + 按真实格式定扩展名。
        校验逻辑集中在 `api/image_validation.py`（与新闻图上传共用）。
      parameters:
      - in: query
        name: format
        schema:
