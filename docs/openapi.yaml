    delete:
      operationId: api_forums_posts_destroy
      description: |-
        删除帖子（第 91 批：改为**软删除**）

        改前是 DRF 默认实现 —— `instance.delete()` 真删行，而 `Comment.post`、
        `Like.post`、`Favorite.post` 都是 `CASCADE`：

            管理员删一条被举报的帖子 → 别人写的 20 条评论、30 个点赞一起消失，
            报错没有、回收站没有、恢复更不可能。

        评论从第 17 批起就是软删除（`is_deleted`），只有帖子是硬删除 —— 口径不一致。
        现在改成：作者本人或管理员删帖 → `post.soft_delete()`（标记 + 清空正文），
        关联的评论/点赞/收藏**原样留在库里**，只是帖子不再出现在任何列表与详情。

        权限不变（`CanDeletePost`：作者或管理员），响应仍是 204。
        需要**真删**（GDPR 式清理、清理测试数据）时请用管理命令，
        不要把这个入口改回硬删除。

        ## 第 219 批：补一条审计日志

        用户问"用户自己删除帖子，后台管理操作那里看不到吗" —— 核实后**确实看不到**：

        - 这里原来只有一句 `logger.info`（写进 `logs/` 文本日志，页面上翻不到）；
        - `AdminAuditLog.ACTION_CHOICES` 里当时**根本没有"删除帖子"这一项**（只有评论的）。

        于是评论能审计、帖子不能 —— 同一套内容两套口径。现在两者都落表。

        ⚠️ **必须在 `soft_delete()` 之前取标题**：`soft_delete()` 会把标题改成
        `[已删除]`，之后再取就只能记到一个没有信息量的字符串（标题快照正是事后
        "删的是哪条"的唯一线索）。
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - txt
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 帖子.
        required: true
      tags:
      - api
      security:
      - deviceTokenAuth: []
      - tokenAuth: []
      responses:
