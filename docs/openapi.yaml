        是最常见的操作。逐条点开弹窗、选状态、保存 —— 10 条就是 10 轮。

        约束（都是有意的）：
          · **只允许 pending / processing / resolved**（用 Feedback.STATUS_CHOICES 校验），
            避免前端传什么就写什么；
