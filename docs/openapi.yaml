          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: 角色
        role_display:
          type: string
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
          title: 工作人员状态
          description: 指明用户是否可以登录到这个管理站点。
        is_superuser:
          type: boolean
          readOnly: true
          title: 超级用户状态
          description: 指明该用户缺省拥有所有权限。
        is_active:
          type: boolean
          readOnly: true
          title: 有效
          description: 指明用户是否被认为是活跃的。以反选代替删除帐号。
        content_modules:
          type: string
          readOnly: true
        content_modules_display:
          type: string
          readOnly: true
        is_expert:
          type: string
          readOnly: true
        expert_title:
          type: string
          readOnly: true
        expert_specialties:
          type: string
          readOnly: true
        expert_granted_at:
          type: string
          readOnly: true
        post_count:
          type: string
          readOnly: true
        comment_count:
          type: string
          readOnly: true
        detection_count:
          type: string
          readOnly: true
        points:
          type: integer
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: 加入日期
        last_login:
          type: string
          format: date-time
          readOnly: true
