        支持参数：
          `search`            用户名 / 识别结果 / 病害名
          `user`              只看某个用户的记录
          `pest`              只看某个病害词条的记录
          `matched`           `true` 只看匹配到词条的；`false` 只看没匹配上的
          `confidence_min`    / `confidence_max`    置信度区间（0~1）
          `date_from`         / `date_to`           `YYYY-MM-DD`
          `ordering`          白名单内，默认 `-timestamp`
