          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/News'
          application/json:
            schema:
              $ref: '#/components/schemas/News'
        required: true
      security:
      - deviceTokenAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/News'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/News'
          description: ''
