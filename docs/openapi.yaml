          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
            text/event-stream:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
            text/event-stream:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '204':
          description: No response body
