        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 删除时间
        comments:
          type: string
          readOnly: true
      required:
      - author
      - board
      - board_id
      - comment_count
      - comments
      - content
      - created_at
      - deleted_at
      - id
      - is_deleted
      - is_favorited
      - is_liked
      - like_count
      - pests
      - status
      - title
      - translation_source
      - translation_stale
      - updated_at
      - view_count
    PostList:
      type: object
      description: |-
        帖子列表序列化器

        第 24 批补齐三个字段（此前导致"草稿其实是公开发布 / 收藏状态看不到"）：
        - ``status``（只读）：让前端能给草稿打角标；
        - ``is_draft``（只写）：前端一直发的就是这个字段，而序列化器里**没有它**，
          DRF 会静默忽略未声明的字段 —— 于是"保存草稿"实际按模型默认值建成了
          **已发布**帖子（配合前端每 30 秒的自动保存，会往论坛里灌半成品已发布帖）。
        - ``is_favorited``：当前用户是否收藏了该帖，供收藏按钮显示实心/空心。
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: 标题
          maxLength: 200
        title_en:
          type: string
          title: 标题（英文）
          maxLength: 200
        content:
          type: string
          title: 内容
        content_en:
          type: string
          title: 内容（英文）
        author:
          allOf:
          - $ref: '#/components/schemas/UserSimple'
          readOnly: true
        board:
          allOf:
          - $ref: '#/components/schemas/ForumBoard'
          readOnly: true
        board_id:
          type: integer
          writeOnly: true
        view_count:
          type: integer
          readOnly: true
          title: 浏览次数
        like_count:
          type: integer
          readOnly: true
          title: 点赞数
        comment_count:
          type: integer
          readOnly: true
          title: 评论数
        is_liked:
          type: string
          readOnly: true
        is_favorited:
          type: string
          readOnly: true
        is_pinned:
          type: boolean
          title: 是否置顶
        is_essence:
          type: boolean
          title: 是否精华
        status:
          allOf:
          - $ref: '#/components/schemas/StatusC30Enum'
          readOnly: true
          title: 状态
        is_draft:
          type: boolean
          writeOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: 更新时间
        translation_stale:
          type: boolean
          readOnly: true
        translation_source:
          type: string
          readOnly: true
        pests:
          type: array
          items:
            $ref: '#/components/schemas/PestTag'
          readOnly: true
        pest_ids:
          type: array
          items:
            type: integer
          writeOnly: true
        is_deleted:
          type: boolean
          readOnly: true
          title: 是否删除
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 删除时间
      required:
      - author
      - board
      - board_id
      - comment_count
      - content
      - created_at
      - deleted_at
      - id
      - is_deleted
      - is_favorited
      - is_liked
      - like_count
      - pests
      - status
      - title
      - translation_source
      - translation_stale
      - updated_at
      - view_count
    PreventionMethod:
      type: object
      description: |-
        防治方法序列化器
        - 用于序列化防治方法数据
        - 包含防治类别、具体措施等信息
      properties:
        id:
          type: integer
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/PreventionMethodCategoryEnum'
          title: 防治类别
        category_display:
          type: string
          readOnly: true
        measure:
          type: string
          title: 具体措施
        measure_en:
          type: string
          title: 具体措施（英文）
        pest:
          type: integer
          title: 关联病害
      required:
      - category
      - category_display
      - id
      - measure
      - pest
    PreventionMethodCategoryEnum:
      enum:
      - AGRICULTURAL
      - CHEMICAL
      - ECOLOGICAL
      - PHYSICAL
      - MONITORING
      type: string
      description: |-
        * `AGRICULTURAL` - 农业防治
        * `CHEMICAL` - 化学防治
        * `ECOLOGICAL` - 生态防治
        * `PHYSICAL` - 物理防治
        * `MONITORING` - 监测预警
    RelatedPestBrief:
      type: object
      description: |-
        第 401 批：新闻卡片上的"关联病害"轻量条目。

        为什么单独做一个只读序列化器、而不是直接嵌套 PestInfo 的完整序列化器：
        卡片只需要 chip 文案与跳转用的标识，塞进 image / symptoms / description
        会让列表响应膨胀好几倍（一条新闻可能挂多个病害）。
      properties:
        id:
          type: integer
        name:
          type: string
        name_en:
          type: string
        crop_type:
          type: string
        crop_type_en:
          type: string
        english_identifier:
          type: string
      required:
      - crop_type
      - crop_type_en
      - english_identifier
      - id
      - name
      - name_en
    RoleEnum:
      enum:
      - ADMIN
      - EDITOR
      - USER
      type: string
      description: |-
        * `ADMIN` - System Administrator
        * `EDITOR` - Information Editor
        * `USER` - Normal User
    SensitiveWord:
      type: object
      description: |-
        敏感词（第 38 批）

        第 135 批：加 `word_en`（**英文对照，只用于显示**）。词条本身是被拦截的字面串，
        中文词库在英文界面下就是一串中文，英文管理员看不出拦的是什么 —— 给它一句英文说法。
        ⚠️ 匹配只看 `word`（见 api/sensitive.py），`word_en` 不参与拦截。
      properties:
        id:
          type: integer
          readOnly: true
        word:
          type: string
          title: 敏感词
          maxLength: 50
        word_en:
          type: string
          title: 英文对照
          maxLength: 80
        category:
          allOf:
          - $ref: '#/components/schemas/SensitiveWordCategoryEnum'
          title: 分类
        category_display:
          type: string
          readOnly: true
        is_active:
          type: boolean
          title: 启用
        note:
          type: string
          title: 备注
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
      required:
      - category_display
      - created_at
      - id
      - word
    SensitiveWordCategoryEnum:
      enum:
      - ad
      - abuse
      - politics
      - other
      type: string
      description: |-
        * `ad` - 广告推广
        * `abuse` - 辱骂攻击
        * `politics` - 涉政违规
        * `other` - 其它
    StatusC30Enum:
      enum:
      - draft
      - pending
      - published
      - hidden
      type: string
      description: |-
        * `draft` - 草稿
        * `pending` - 待审核
        * `published` - 已发布
        * `hidden` - 隐藏
    TargetTypeEnum:
      enum:
      - category
      - pest
      type: string
      description: |-
        * `category` - 分类
        * `pest` - 病害
    TaskReminderRequestSchema:
