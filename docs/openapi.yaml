        * `reply` - 有人回复了你
        * `like` - 有人点赞了你
        * `favorite` - 有人收藏了你
        * `comment_like` - 有人点赞了你的评论
        * `follow` - 有人关注了你
        * `message` - 有人给你发了私信
        * `announcement` - 系统公告
        * `system` - 系统消息
