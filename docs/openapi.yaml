        与农户端的 `DELETE .../comments/<pk>/` 同一口径（那里也是 `is_full_admin`）。
        硬删除**不可逆**，所以：
          · 只给全权管理员（内容编辑员用软删除）；
          · 审计日志里留下评论内容的前 50 字 —— 行删了之后，这是唯一的线索。
