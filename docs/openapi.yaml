  /api/admin/comments/{id}/restore/:
    post:
      operationId: api_admin_comments_restore_create
      description: |-
        恢复一条被软删除的评论（第 152 批，**仅全权管理员**）

        为什么恢复也只给全权管理员（和硬删除同档）：
          · 软删除是**审核判断**（"这条违规，撤下来"），推翻它等于推翻另一个审核员的判断；
          · 而且删除可能是**作者本人**做的（`deleted_by` 记着），把他自己删掉的评论
            放回去更需要权限，不该随手能做。
        编辑员要做的是"删"（本职），"恢复"是纠错 —— 纠错找管理员。

        ⚠️ 一个必须说清的边界：**本批之前删除的评论没有留存原文**（那时还没有这个字段），
        所以恢复不了 —— 这时返回 400 并明确说明原因，而不是"恢复"成 `[已删除]`
        （那样比不恢复更糟：看起来恢复了，内容却是占位文案）。
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - txt
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - deviceTokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
            text/event-stream:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
            text/event-stream:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '204':
          description: No response body
