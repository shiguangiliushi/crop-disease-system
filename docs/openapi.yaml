    UserProfile:
      type: object
      description: 用户资料序列化器（本人或管理员查看时使用，含邮箱等）
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: 用户名
          description: 必填；长度为150个字符或以下；只能包含字母、数字、特殊字符“@”、“.”、“-”和“_”。
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: 电子邮件地址
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          title: 名字
          maxLength: 150
        last_name:
          type: string
          title: 姓氏
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          title: 角色
        bio:
          type: string
          nullable: true
          title: 个人简介
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: 加入日期
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 上次登录
        avatar:
          type: string
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
        following_count:
          type: string
          readOnly: true
        follower_count:
          type: string
          readOnly: true
        is_following:
          type: string
          readOnly: true
        is_self:
          type: string
          readOnly: true
        points:
          type: string
          readOnly: true
      required:
      - avatar
      - date_joined
      - follower_count
      - following_count
      - id
      - is_following
      - is_self
      - is_staff
      - last_login
      - points
      - username
    UserSimple:
      type: object
      description: |-
        用户简单信息序列化器

        第 25 批补充 ``avatar``：论坛各处模板早就在用 ``post.author.avatar`` /
        ``comment.author.avatar``，但当时模型没有头像字段、这里也不返回 →
        永远拿不到值（只能靠首字母兜底）。第 23 批加了真实头像后，这里同步返回。
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: 用户名
          description: 必填；长度为150个字符或以下；只能包含字母、数字、特殊字符“@”、“.”、“-”和“_”。
        avatar:
          type: string
          readOnly: true
      required:
      - avatar
      - id
      - username
    VerdictEnum:
      enum:
      - useful
      - useless
      type: string
      description: |-
        * `useful` - useful
        * `useless` - useless
    VerifyStatusEnum:
      enum:
      - pending
      - confirmed
      - rejected
      type: string
      description: |-
        * `pending` - 待确认
        * `confirmed` - 已确认
        * `rejected` - 已排除
  securitySchemes:
    deviceTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'DeviceToken 认证：`Authorization: Token <key>`。与 drf 自带的 tokenAuth
        使用同一个 header —— 服务端先按 DeviceToken 查，查不到再退回 drf Token（兼容老客户端）。'
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
