          「加载更多回复」，此前后端从不返回该字段 → 按钮永远不渲染，回复列表也就
          无法展开。
        - ``reply_to``：回复目标用户（``reply_to_user``）。此前只存不返回，
          界面上「回复 @某人」的信息完全丢失。
        - ``parent``：父评论 id，便于前端判断层级。

