  /api/admin/users/:
    get:
      operationId: api_admin_users_list
      description: |-
        管理端用户列表（第 76 批）

        GET /api/admin/users/?search=&role=&status=&page=&page_size=
          · 仅管理员（IsAdminUser：is_staff=True）
          · search 走 SearchFilter，匹配 用户名 / 邮箱 / 姓名
          · role   ∈ ADMIN | EDITOR | USER
          · status ∈ active | disabled | expert | staff
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - txt
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - deviceTokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
    post:
      operationId: api_admin_users_create
      description: |-
        批量删除用户（第 100 批，仅管理员）

            POST /api/admin/users/bulk-delete/   body: {"ids": [1,2,3]}

        **为什么不用 DRF 的 `@action`**：本视图是 `ListAPIView`（不是 ViewSet），
        `@action` 只对 ViewSet 生效，写在上面会直接 `NameError`（实测）。
        两个选择：改成 `ViewSet.as_view({'get':'list','post':'bulk_delete'})`
        （要动 urls.py，还可能影响其它调用），或者在这里按路径分流。
        这里选后者：改动面最小，且路由仍是那一条 `admin/users/`。

        **逐条走与单条删除完全相同的护栏**（`_check_delete_allowed`）——
        批量入口最容易变成"绕过单条校验的后门"，所以刻意不写第二套判断。

        响应逐条给结果：成功几条、跳过几条、各自原因。
        前端把"跳过的"显示出来，避免管理员以为全都删了。
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - txt
      tags:
      - api
      requestBody:
        content:
          application/json:
