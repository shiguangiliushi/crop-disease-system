  /api/news/:
    get:
      operationId: api_news_list
      description: |-
        新闻列表
        - 支持分页
        - 支持按标题 / 内容 / 全部搜索（search + search_type；第 401 批起 content/all
          也会搜摘要，且标题命中的条目整体排在前面）
        - 支持按分类筛选（category）
        - 支持按发布状态筛选（is_published=true/false，仅对管理员有意义）
        - 第 399 批：支持排序（ordering）、标签（tags）、时间范围（date_range），
          以及仅在 featured=1 时返回的"头条精选"段（featured）
        - 第 401 批：支持按关联病害过滤（pest=<id>）
      parameters:
      - in: query
        name: date_range
        schema:
          type: string
        description: 时间范围：7d（近 7 天） / 30d（近 30 天） / all（默认，不限）。按"有效发布时间"筛：published_at
          为空时用 created_at。
      - in: query
        name: featured
        schema:
          type: string
        description: 传 1 / true / yes 时，在响应里额外返回 featured 段（is_featured=True 的前 3
          条，已从普通列表与 count 中剔除）；默认不返回该键。
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - txt
      - in: query
        name: ordering
        schema:
          type: string
        description: 排序方式：recent（默认，最新） / hot（最热） / oldest（最早）；也兼容裸字段 created_at /
          views / published_at / updated_at（可带 - 前缀）。
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: pest
        schema:
          type: integer
        description: 按关联病害 id 过滤（第 401 批新增）；非数字 / 非正数 id 返回 400。
      - in: query
        name: tags
        schema:
          type: string
        description: 标签筛选，逗号分隔（中英文逗号 / 顿号 / 分号均可），最多取前 5 个；多个标签是 AND（必须同时命中）。
      tags:
      - api
      security:
      - deviceTokenAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNewsList'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/PaginatedNewsList'
          description: ''
    post:
      operationId: api_news_create
      description: |-
        新增新闻

        注意：这里直接把 request.data 交给序列化器。
        原实现做了 request.data.copy()，它会深拷贝上传文件；当图片超过
        2.5MB（FILE_UPLOAD_MAX_MEMORY_SIZE）时 Django 使用的是
        TemporaryUploadedFile（内部持有真实文件句柄），深拷贝会抛
        TypeError: cannot pickle '_io.BufferedRandom' object，导致 500。
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - txt
      tags:
      - api
      requestBody:
        content:
          multipart/form-data:
            schema:
