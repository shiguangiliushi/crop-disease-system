      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - txt
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 行业新闻.
        required: true
      tags:
      - api
      security:
      - deviceTokenAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/news/{id}/detail/:
    get:
      operationId: api_news_detail_retrieve
      description: |-
        获取新闻详情（兼容旧版接口 `GET /api/news/{pk}/detail/`）

        第 399 批：本接口**不**计阅读量 —— 它只为老客户端保留，纯读；
        若这里也计数，同一次阅读（前端轮询主详情 + 触发兼容接口）会被算两次。

        ⚠️ 本动作**绝对不能**命名为 `detail`：
        DRF 的路由在创建视图时会传入 `initkwargs={'detail': True/False, ...}`，
        视图实例上因此存在一个布尔属性 `self.detail = True`，它会把**同名的 action
        方法整个覆盖掉**；随后 `ViewSetMixin` 执行
        `setattr(self, 'get', getattr(self, 'detail'))`，`self.get` 就成了布尔值 `True`，
        请求时 `handler(request)` 直接抛
        `TypeError: 'bool' object is not callable`。

        实测（修复前）：`GET /api/news/12/detail/` 无论匿名还是管理员都 **100% 500**。
        现改名为 `legacy_detail`，并用 `url_path='detail'` 保持对外 URL 不变。
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - txt
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 行业新闻.
        required: true
      tags:
      - api
      security:
      - deviceTokenAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/News'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/News'
          description: ''
  /api/news/{id}/related/:
    get:
      operationId: api_news_related_retrieve
      description: |-
        第 401 批：相关推荐（`GET /api/news/{pk}/related/`）

        为什么放在后端：相关推荐要综合"同病害 / 同分类 / 标签重叠"三类信号，
        前端要自己算就得先把整库新闻拉下来；打分权重也会随运营策略调整，
        收口在后端才能一处改、全端生效。

        口径：
          · 候选从 `self.get_queryset()` 出发并排除自身 —— 匿名拿不到草稿 / 未到点；
          · SQL 只做**候选初筛**（同分类 | 关联病害命中 | 自身前 3 个标签命中）
            并 distinct，最多取 200 条；精排在 Python 侧做 —— "病害重合几个、
            标签重合几个"用 SQL 表达既别扭又难维护；
          · 打分：每重合 1 个关联病害 +3、同分类 +2、每重合 1 个标签 +1（最多 +3）；
          · 只返回 score>0 的，按 (-score, -created_at) 排序，limit 默认 4、范围 1..10。
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - txt
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 行业新闻.
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: 返回条数，默认 4，有效范围 1..10；非法值回退默认值。
      tags:
      - api
      security:
      - deviceTokenAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsRelatedResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/NewsRelatedResponse'
          description: ''
  /api/news/ai-assist/:
    post:
      operationId: api_news_ai_assist_create
      description: |-
        第 404 批（P2-10）：新闻编辑 AI 辅助（`POST /api/news/ai-assist/`）

        入参：`{action: summary|title|tags|translate, title?, summary?, content?, tags?}`

        为什么放在新闻接口里而不是另开一套 AI 接口：四个动作都是"编辑一篇新闻时的
        辅助工具"，权限与新闻维护完全一致（CONTENT），复用 `get_permissions()` 与
        `_can_manage_news` 就不会出现"看新闻的人能调 AI、能改新闻的人反而不能"的错位。

        失败语义（前端按状态码区分即可）：
          · 503 + `AI 服务未启用或未配置`：没配 LLM 环境变量（不是 bug，先关掉入口）；
          · 503 + `AI 服务暂不可用：…`：网络/超时/HTTP 错误（可重试）；
          · 429：本小时调用次数超限（稍后再试）；
          · 500：其它未预期错误（后端看日志）。
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - txt
      tags:
      - api
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          application/json:
            schema:
              type: object
              additionalProperties: {}
      security:
      - deviceTokenAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
            text/event-stream:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
            text/event-stream:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
            text/event-stream:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
            text/event-stream:
              schema:
                type: object
                additionalProperties: {}
          description: ''
