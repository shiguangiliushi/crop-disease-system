        筛选：`?post=&author=&search=&only_deleted=&ordering=&page=&page_size=`
          · `search` 匹配评论内容（也匹配 `content_en`，英文内容站也要查得到）；
          · `only_deleted=true` → **只看**已删除的（审计"谁删了什么"，第 91 批对帖子就是这个约定）；
          · 默认**不含**已删除的（与农户端一致，否则列表里全是 `[已删除]`）。
      parameters:
      - in: query
        name: format
