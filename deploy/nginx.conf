# ============================================================================
# Nginx 配置：静态产物 + API/媒体反代（第 94 批）
# ----------------------------------------------------------------------------
# 挂载位置（见 docker-compose.yml）：
#   ./deploy/nginx.conf → /etc/nginx/conf.d/default.conf
#
# 设计要点：
#   · 桌面端在 `/`，移动端在 `/m/`（同域——这样 Session/Cookie 与 CORS 都最省事）；
#   · `/api/`、`/media/`、`/static/`（Django admin 样式）反代到后端；
#   · **`client_max_body_size` 必须调大**：默认 1MB，而识别图允许到 5MB，
#     不改的话上传会在 Nginx 层就被拒（返回 413，且**前端看不到 Django 的提示**）；
#   · 识别接口慢，`proxy_read_timeout` 要给足（与 gunicorn 的 120s 对齐）。
# ============================================================================
upstream crop_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # 与 api/image_validation.py 的 5MB 上限对齐（留一点余量给 multipart 边界）
    client_max_body_size 12m;

    # 用 gzip 发静态产物（前端 JS/CSS 都是文本，压缩收益很大）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API ────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://crop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 后端靠这个头判断"原始请求是 https"（配合 SECURE_PROXY_SSL_HEADER）
        proxy_set_header X-Forwarded-Proto $scheme;
        # 识别是 CPU 密集的，超时要给够（否则 Nginx 先 504）
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ── Django admin（样式来自 /static/）────────────────────────────────────
    location /static/ {
        proxy_pass http://crop_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }
    location /admin/ {
        proxy_pass http://crop_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 用户上传的媒体文件：Nginx 直接发（比 Django 发高效得多）──────────────
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── 移动端（H5）─────────────────────────────────────────────────────────
    # 放在桌面前面：否则 `/m/...` 会被 `/` 的 SPA 回退吃掉。
    location /m/ {
        alias /usr/share/nginx/html-mobile/;
        try_files $uri $uri/ /m/index.html;
    }

    # ── 桌面端（SPA，vue-router history 模式）────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的产物文件名可以长缓存；index.html 必须不缓存（否则发版后用户拿到旧壳）
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}
