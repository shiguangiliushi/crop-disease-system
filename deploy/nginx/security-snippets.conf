# 安全加固片段（第 441 批）
# ============================================================================
# 这个文件**不会被自动加载** —— 它是给 `deploy/nginx.conf`（线上那份）手工合并用的
# 片段集合。每一段都标了"贴在哪里"，合并后必须：
#
#     docker run --rm --network app_default \
#       -v $PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
#       -v $PWD/deploy/certs:/etc/nginx/certs:ro \
#       nginx:1.27-alpine nginx -t
#     docker compose up -d --force-recreate nginx
#
# 全部条目都是"限速/限流/鉴权"，**不改动任何正常请求的路径**。
# ============================================================================


# ── 1. 限速 zone（贴到 http { } 里，和 upstream 同级）─────────────────────────
#
# 目的：拦住"换 IP 刷识别"。代码层的 `GuestTrialQuota` 是"每 IP 每天 3 次"，
# 但**换一个 IP 就刷新** —— 只有 nginx 这一层能按"来源 IP + 单位时间"限速。
#
# 6r/m 是"正常人手点 3 次识别"的 2 倍余量；burst 允许一次页面操作里的并发。
limit_req_zone $binary_remote_addr zone=crop_detect:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=crop_guest:10m  rate=2r/m;
# 兜底：整个 /api/ 的粗粒度防洪（正常浏览远达不到）
limit_req_zone $binary_remote_addr zone=crop_api:10m    rate=120r/m;


# ── 2. 精确限速的 location（贴到 443 的 server { } 里，**排在 location /api/ 之前**）
#
# ⚠️ 必须写在 `location /api/` 前面：nginx 的前缀匹配选"最长匹配"，
#    但同长度的精确匹配（=）优先，所以顺序其实不影响；放前面只是为了可读性。
#
# ⚠️ 这三段都要**复制原有的 proxy_set_header**（Host / X-Real-IP / X-Forwarded-For /
#    X-Forwarded-Proto）—— 少了任何一个，后端的 IP、URL 生成、HTTPS 判定都会退回错误值。
location = /api/detect/ {
    limit_req zone=crop_detect burst=3 nodelay;
    limit_req_status 429;

    proxy_pass http://crop_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;          # 冷启动首张识别约 26s，别用默认 60s
}

location = /api/guest/session/ {
    limit_req zone=crop_guest burst=2 nodelay;
    limit_req_status 429;

    proxy_pass http://crop_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 粗粒度兜底：贴进现有的 `location /api/ { }` 里（加一行即可）
#     limit_req zone=crop_api burst=60 nodelay;


# ── 3. 可选：把历史上传目录也变成"私有"（需要签名）───────────────────────────
#
# 默认**不要**打开。打开需要两处同时改：
#
#   a) 这里把 `detection_uploads` 加进正则：
#      location ~ ^/media/(assistant_uploads|detection_history|consult_images|feedback_images|detection_uploads)/ {
#          proxy_pass http://crop_backend;
#          proxy_set_header Host $host;
#          proxy_set_header X-Real-IP $remote_addr;
#          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#          proxy_set_header X-Forwarded-Proto $scheme;
#      }
#
#   b) 后端 `.env` 加 `DJANGO_PRIVATE_DETECTION_UPLOADS=True` 并重启 backend。
#
# 风险：只改 a 不改 b → 图片没有签名，全部 403/404；只改 b 不改 a →
# nginx 直接发文件，签名形同虚设。两处一起改，改完刷新一次列表即可。
# 回滚：删掉 b 那行重启（旧的无签名 URL 立刻恢复可用），a 可以留着。
# ── 4. `/admin/` 双占用：Django 后台 vs Vue 管理端（第 445 批）─────────────────
#
# 症状：在 `/admin/dashboard` 上**刷新**，浏览器拿到的是 Django 的 404
#       （"The requested resource was not found on this server."）。
# 原因：本项目把 `/admin/` 同时给了两个应用 ——
#   · Django 自带后台：`/admin/`、`/admin/login/`、`/admin/api/news/` …（**都带尾斜杠**）
#   · Vue 管理端：`/admin/dashboard`、`/admin/users` …（**都不带尾斜杠**）
# 而 nginx 里一条 `location /admin/ { proxy_pass … }` 把两者一起转给了后端，
# 前端路由只在"点链接"时生效，硬刷新就 404。
#
# 修法：按尾斜杠分流。`location =` 精确匹配优先，`location ~` 正则优先于前缀匹配，
# 所以下面三段可以共存、互不遮挡：
location = /admin/ {
    proxy_pass http://crop_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ~ ^/admin/.+/$ {
    proxy_pass http://crop_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# Vue 管理端（无尾斜杠）→ 交给 SPA
location /admin/ {
    try_files $uri $uri/ /index.html;
}
